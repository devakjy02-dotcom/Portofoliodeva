<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">      
</head>
<body>
    <style>
    body{
        background:none;
        margin:0;
        padding:0;
        background-size:cover;
        background-position:center;
        background-repeat:non-repeat;
        background-attachment:fixed;
        font-family:sans-serif;
    }

    .login{
        position:fixed;
        top:50%;
        left:45%;
        transform:translate(-30%, -50%);
        background:rgba(46, 59, 99, 0.5);
        padding:60px;
        width:380px;
        box-shadow:0px 0px 25px 10px black;
        border-radius:25px;
    }

    .avatar{
        font-size:30px;
        background:#d8ecfd;
        width:50px;
        height:50px;
        line-height:50px;
        position:fixed;
        left:50%;
        top:0;
        transform:translate(-50%, -50%);
        text-align:center;
        border-radius:50%;
    }

    .login h2{
        text-align:center;
        color:white;
        font-size:30px;
        font-family:sans-serif;
        letter-spacing:3px;
        padding-top:0;
        margin-top:-20px;
    }

    .box-login{
        display:flex;
        justify-content:space-between;
        margin:10px;
        border-bottom:2px solid white;
        padding:10px 0;
    }

    .box-login i{
        font-size:23px;
        color:white;
        padding:7px 0;
    }

    .box-login input{
        width:85%;
        padding:5px 0;
        background:none;
        border:none;
        outline:none;
        color:white;
        font-size:18px;
    }

    .box-login input::placeholder{
        color:white;
    }

    .btn-login
    .box-login input:hover{
        background:rgba(10,10,10,s 0.5);
    }

    .btn-login{
        margin-left:10px;
        margin-bottom:20px;
        background:white;
        border:1px solid white;
        width:92.5%;
        padding:10px;
        color:white;
        font-size:18px;
        letter-spacing:3px;
        cursor:pointer;
    }

    .bottom{
        margin-left:10px;
        margin-right:10px;
        display:flex;
        justify-content:space-between;
    }

    .btn-login:hover{
        background:rgba(62, 114, 129, 0.5);
    }

    .bottom a{
        color:white;
        font-size:15px;
        text-decoration:none;
    }

    .bottom a:hover{
        text-decoration:underline;
    }
    </style>

    <div class="login">
		<div class="avatar">
			<i class="fa fa-user"></i>
		</div>
			<h2>LOGIN FORM</h2>
		<div class="box-login">
			<i class="fas fa-envelope-open-text"></i>
			<input type="text" placeholder="Email">
		</div>
		<div class="box-login">
			<i class="fas fa-lock"></i>
			<input type="text" placeholder="Password">
		</div>
			<button type="submit" name="login" class="btn-login"><a href="index.html">LOGIN</button></a>
		<div class="bottom">
			<a href="#">REGISTER</a>
			<a href="#">FORGOT PASSWORD</a>
		</div>
	</div>
    
</body>
</html>
