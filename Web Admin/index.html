             <div class="p-4 bg-light rounded-3">

            <style>
                h1,h2,p,a{
                    font-family:Arial, Helvetica, sans-serif;
                    font-weight:normal;
                }
                .jam-digital-deva{
                    overflow:hidden;
                    width: 333px;
                    margin: 50px auto;
                    border: 5px solid rgb(59, 85, 150);
                }
                .kotak{
                    float: left;
                    width: 100px;
                    height: 100px;
                    background-color: rgb(255, 255, 255);
                }
                .jam-digital-deva p{
                    color: rgb(20, 35, 62);
                    font-size: 36px;
                    text-align: center;
                    margin-top: 30px;
                }
            </style>
            <div class="jam-digital-deva">
                <div class="kotak">
                    <p id="jam"></p>
                </div>
                <div class="kotak">
                <p id="menit"></p>
                </div> 
                <div class="kotak">
                <p id="detik"></p>
                </div>
            </div>
            <script>
        window.setTimeout("waktu()", 1000);
        function waktu() {
            var waktu = new Date();
            setTimeout("waktu()", 1000);
            document.getElementById("jam").innerHTML = waktu.getHours();
            document.getElementById("menit").innerHTML = waktu.getMinutes();
            document.getElementById("detik").innerHTML = waktu.getSeconds();
             }
            </script>
